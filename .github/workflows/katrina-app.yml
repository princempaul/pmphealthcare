name: Katrina app build

on:
  push:
    paths: ["apps/Katrina/**", ".github/workflows/katrina-app.yml"]
  pull_request:
    paths: ["apps/Katrina/**", ".github/workflows/katrina-app.yml"]
  workflow_dispatch:
    inputs:
      step:
        description: What to run
        type: choice
        default: build and upload
        options: ["build and upload", "testers only"]

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.step != 'testers only'
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS Simulator", "generic/platform=macOS"]
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/Katrina && xcodegen generate

      - name: Build (${{ matrix.destination }})
        run: |
          set -o pipefail
          cd apps/Katrina
          xcodebuild -project Katrina.xcodeproj -scheme Katrina \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show the errors
        if: failure()
        run: grep -E "error:" -A3 apps/Katrina/build.log | head -150 || true

  testflight:
    # Runs by hand (Actions > Katrina app build > Run workflow) once the App Store Connect secrets exist.
    if: github.event_name == 'workflow_dispatch' && inputs.step != 'testers only'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # The three IDs aren't secret, so they can sit under Secrets or Variables. The .p8 key must be a Secret.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
      # Where each one was found (true/false only, never the value), so a failed run says what to move.
      WHERE: >-
        secrets[ID=${{ secrets.ASC_KEY_ID != '' }} ISSUER=${{ secrets.ASC_ISSUER_ID != '' }} P8=${{ secrets.ASC_KEY_P8 != '' }} TEAM=${{ secrets.APPLE_TEAM_ID != '' }}]
        variables[ID=${{ vars.ASC_KEY_ID != '' }} ISSUER=${{ vars.ASC_ISSUER_ID != '' }} P8=${{ vars.ASC_KEY_P8 != '' }} TEAM=${{ vars.APPLE_TEAM_ID != '' }}]
    steps:
      - uses: actions/checkout@v4

      - name: Check the App Store Connect secrets are set
        run: |
          echo "Found: $WHERE"
          # Shape checks only (lengths and patterns, never values), to explain a 401 from Apple.
          shape() { [[ "$2" =~ $3 ]] && echo "$1 looks right" || echo "::warning::$1 doesn't look right ($4). Length ${#2}."; }
          shape ASC_KEY_ID "$ASC_KEY_ID" '^[A-Z0-9]{10}$' "should be 10 capitals/digits, the Key ID next to the key's name"
          shape ASC_ISSUER_ID "$ASC_ISSUER_ID" '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' "should be the long Issuer ID with dashes, shown above the keys list"
          shape APPLE_TEAM_ID "$APPLE_TEAM_ID" '^[A-Z0-9]{10}$' "should be 10 capitals/digits from developer.apple.com > Membership"
          printf '%s' "$ASC_KEY_P8" | grep -q -- "-----BEGIN PRIVATE KEY-----" && printf '%s' "$ASC_KEY_P8" | grep -q -- "-----END PRIVATE KEY-----" \
            && echo "ASC_KEY_P8 has the BEGIN and END lines ($(printf '%s\n' "$ASC_KEY_P8" | wc -l | tr -d ' ') lines)" \
            || echo "::warning::ASC_KEY_P8 is missing the BEGIN/END PRIVATE KEY lines. Paste the whole .p8 file."
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is missing. Add it under Settings > Secrets and variables > Actions."; exit 1; }
          done

      - name: Use the newest Xcode and generate the project
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen
          cd apps/Katrina && xcodegen generate

      - name: Archive for iPhone (signed with the API key)
        run: |
          set -o pipefail
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cd apps/Katrina
          xcodebuild archive -project Katrina.xcodeproj -scheme Katrina \
            -destination 'generic/platform=iOS' -archivePath build/Katrina.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cd apps/Katrina
          xcodebuild -exportArchive -archivePath build/Katrina.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|Upload|EXPORT" || true
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" export.log
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple's processing (usually 5-30 minutes)."

      - name: Remove the key file
        if: always()
        run: rm -rf ~/private_keys

      - name: Show the errors
        if: failure()
        run: grep -hE "error:" -A3 apps/Katrina/archive.log apps/Katrina/export.log 2>/dev/null | head -150 || true

  testers:
    # Internal TestFlight group "Me" with every build, and the account's Admin users in it.
    needs: testflight
    if: always() && github.event_name == 'workflow_dispatch' && (needs.testflight.result == 'success' || inputs.step == 'testers only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]"
      - run: python3 apps/Katrina/ci/testflight_testers.py
